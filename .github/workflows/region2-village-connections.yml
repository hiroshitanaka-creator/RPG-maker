name: 006 固定受入と最新回帰
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
env:
  GODOT_VERSION: 4.7.2-stable
  GODOT_LINUX_SHA256: cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4
  FIXED_006_SHA: 5f1c2ba231191b25b9b32a814b616a9f8d0a54ce
  FIXED_009_SHA: ce07fdada0466138260ab678c10fd78e61c0c63d
  FIXED_012_SHA: c327e7c439c9c8c8f1fd640e6cda6df7550fb26a
jobs:
  acceptance-and-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: current
    strategy:
      fail-fast: false
      matrix:
        generation: [fixed, latest]
    env:
      RPG_QA_SAVE_PREFIX: ci-village009-runtime-${{ matrix.generation }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          path: current
      - uses: actions/checkout@v4
        with:
          ref: 5f1c2ba231191b25b9b32a814b616a9f8d0a54ce
          fetch-depth: 0
          path: fixed
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 指定ハッシュのGodotを取得
        run: |
          curl -fL -o ../godot.zip "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          echo "${GODOT_LINUX_SHA256}  ../godot.zip" | sha256sum --check
          unzip -q ../godot.zip -d ..
          mv ../Godot_v${GODOT_VERSION}_linux.x86_64 ../godot
          chmod +x ../godot
      - name: 対象checkoutを600秒以内にインポート
        run: |
          set -o pipefail
          target=../fixed
          if [ "${{ matrix.generation }}" = latest ]; then target=.; fi
          timeout 600 ../godot --headless --path "$target" --editor --import --quit 2>&1 | tee import.log
          if grep -E "SCRIPT ERROR|ERROR:|WARNING:|Parse Error" import.log; then exit 1; fi
      - name: 固定006の全範囲監査・7592項目・20保存・5別プロセス
        if: matrix.generation == 'fixed'
        run: |
          python tools/check_task009_lifecycle.py --fixed-sha "$FIXED_006_SHA" --fixed-path ../fixed --godot ../godot
          (cd ../fixed && python tools/check_frozen_files.py)
      - name: 最新SHAの継続条件・20保存・5別プロセス
        if: matrix.generation == 'latest'
        run: |
          python tools/check_task009_assertion_map.py
          python tools/check_region2_village_regression.py --commit "$GITHUB_SHA" --godot ../godot
          python tools/check_frozen_files.py
      - name: 証拠を保存
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: village009-runtime-${{ matrix.generation }}
          path: |
            current/import.log
            current/docs/verification/task-009/
  normal-input-and-rendering:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: current
    strategy:
      fail-fast: false
      matrix:
        generation: [fixed, latest]
        mode: [journey, details, restart-0, restart-1, restart-2, restart-3, restart-4]
    env:
      RPG_QA_SAVE_PREFIX: ci-village009-render-${{ matrix.generation }}-${{ matrix.mode }}
      LIBGL_ALWAYS_SOFTWARE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          path: current
      - uses: actions/checkout@v4
        with:
          ref: 5f1c2ba231191b25b9b32a814b616a9f8d0a54ce
          fetch-depth: 0
          path: fixed
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 実描画の仮想画面とソフトウェアドライバを用意
        run: sudo apt-get update && sudo apt-get install -y xvfb mesa-vulkan-drivers
      - name: 指定ハッシュのGodotを取得
        run: |
          curl -fL -o ../godot.zip "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          echo "${GODOT_LINUX_SHA256}  ../godot.zip" | sha256sum --check
          unzip -q ../godot.zip -d ..
          mv ../Godot_v${GODOT_VERSION}_linux.x86_64 ../godot
          chmod +x ../godot
      - name: 対象checkoutを600秒以内にインポート
        run: |
          set -o pipefail
          target=../fixed
          if [ "${{ matrix.generation }}" = latest ]; then target=.; fi
          timeout 600 ../godot --headless --path "$target" --editor --import --quit 2>&1 | tee import.log
          if grep -E "SCRIPT ERROR|ERROR:|WARNING:|Parse Error" import.log; then exit 1; fi
      - name: 固定版の通常保存を当時の全検査で用意
        if: matrix.generation == 'fixed'
        run: python tools/check_task009_lifecycle.py --fixed-sha "$FIXED_006_SHA" --fixed-path ../fixed --godot ../godot
      - name: 固定版の通常操作・画素検査を180秒で再実行
        if: matrix.generation == 'fixed'
        run: python tools/check_task009_lifecycle.py --fixed-sha "$FIXED_006_SHA" --fixed-path ../fixed --godot ../godot --capture "${{ matrix.mode }}"
      - name: 最新版の通常保存を全継続検査で用意
        if: matrix.generation == 'latest'
        run: python tools/check_region2_village_regression.py --commit "$GITHUB_SHA" --godot ../godot
      - name: 最新版の通常操作・画素検査を180秒で実行
        if: matrix.generation == 'latest'
        run: python tools/check_region2_village_regression.py --commit "$GITHUB_SHA" --godot ../godot --capture "${{ matrix.mode }}"
      - name: 保護照合
        if: always()
        run: python tools/check_frozen_files.py
      - name: 証拠を保存
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: village009-render-${{ matrix.generation }}-${{ matrix.mode }}
          path: |
            current/import.log
            current/docs/verification/task-009/
  lifecycle-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: current
    env:
      RPG_QA_SAVE_PREFIX: ci-village009-negative
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          path: current
      - uses: actions/checkout@v4
        with:
          ref: 5f1c2ba231191b25b9b32a814b616a9f8d0a54ce
          fetch-depth: 0
          path: fixed
      - uses: actions/checkout@v4
        with:
          ref: ce07fdada0466138260ab678c10fd78e61c0c63d
          fetch-depth: 0
          path: completed009
      - uses: actions/checkout@v4
        with:
          ref: c327e7c439c9c8c8f1fd640e6cda6df7550fb26a
          fetch-depth: 0
          path: completed012
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: NPC正例の実描画用仮想画面を用意
        run: sudo apt-get update && sudo apt-get install -y xvfb mesa-vulkan-drivers
      - name: 指定ハッシュのGodotを取得
        run: |
          curl -fL -o ../godot.zip "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          echo "${GODOT_LINUX_SHA256}  ../godot.zip" | sha256sum --check
          unzip -q ../godot.zip -d ..
          mv ../Godot_v${GODOT_VERSION}_linux.x86_64 ../godot
          chmod +x ../godot
      - name: 最新コードを600秒以内にインポート
        run: |
          set -o pipefail
          timeout 600 ../godot --headless --path . --editor --import --quit 2>&1 | tee import.log
          if grep -E "SCRIPT ERROR|ERROR:|WARNING:|Parse Error" import.log; then exit 1; fi
      - name: 006・009・012の不変完成点と後続編集の反証
        run: |
          timeout 180 python ../completed012/tools/test_task012_pinned_audit.py --current-path . --fixed009-path ../completed009 --completed012-sha "$FIXED_012_SHA" --latest-sha "$GITHUB_SHA"
      - name: 既存固定記録を信頼基点に012の全参照と実checkoutを独立照合
        run: |
          timeout 180 python tools/check_task016_fixed_anchor.py --current-path . --fixed012-path ../completed012 --latest-sha "$GITHUB_SHA"
          timeout 180 python tools/test_task016_fixed_anchor.py --fixed012-path ../completed012 --latest-sha "$GITHUB_SHA"
      - name: 009完成点だけを独立範囲監査
        run: |
          # 完成SHAの当時検査器で完成差分のみを監査する。
          (cd ../completed009 && python tools/check_task009_scope.py --commit "$FIXED_009_SHA")
          python tools/check_task009_assertion_map.py
      - name: 異常SHA・誤接続・不正保存受理を別コピーで拒否
        run: python tools/test_task009_lifecycle.py --fixed-path ../fixed --godot ../godot
      - name: 保護照合
        if: always()
        run: python tools/check_frozen_files.py
      - name: 監査証拠を保存
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: village009-lifecycle-audit
          path: |
            current/import.log
            current/docs/verification/task-009/
            completed009/docs/verification/task-009/scope-checks.json
            current/docs/verification/task-012/
            current/docs/verification/task-016/
