name: Equipment and Save CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  GODOT_VERSION: 4.7.2-stable
  GODOT_LINUX_SHA256: cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4

jobs:
  core:
    name: equipment-core (${{ matrix.profile }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        profile: ["036", "038", "041", "latest"]
    steps:
      - uses: actions/checkout@v4
        with:
          # PRのmerge refで固定版と最新HEADを混同しない。
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 完成版・基点・当時の原証拠を完全SHAで取得
        run: |
          git fetch --no-tags --depth=1 origin \
            dbceae8f68e18939a40ace71f3a24a1a1953e653 \
            45a58b7faf09809d916954353a3a1fe0c3d2d035 \
            8d3c1848d09b588fa41bcf6345d3aab6e12a5347 \
            821448b384d37edc041152beb5d6b6f560ad771d \
            79caadbe71e13ba7060aab598dc460035b04cab9 \
            2547e91d36c59ed6d59f46be15c5c40b20a6b184 \
            ddf2153e0f47513eb7906ddd68ab03b645edacd7
      - name: 公式Godotを既存指定hashで照合
        run: |
          curl -fL -o "$RUNNER_TEMP/equipment-godot.zip" "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          echo "${GODOT_LINUX_SHA256}  $RUNNER_TEMP/equipment-godot.zip" | sha256sum --check
          unzip -q "$RUNNER_TEMP/equipment-godot.zip" -d "$RUNNER_TEMP/equipment-bin"
          mv "$RUNNER_TEMP/equipment-bin/Godot_v${GODOT_VERSION}_linux.x86_64" "$RUNNER_TEMP/equipment-bin/godot"
          chmod +x "$RUNNER_TEMP/equipment-bin/godot"
      - name: 正常装備5394条件と038以降の追加93条件
        run: |
          python tools/run_equipment_ci.py --suite core --profile "${{ matrix.profile }}" \
            --latest-sha "$(git rev-parse HEAD)" --godot "$RUNNER_TEMP/equipment-bin/godot" \
            --output "$RUNNER_TEMP/equipment-evidence"
      - name: 最新checkoutの保護照合（失敗時も実行）
        if: always()
        run: python tools/check_frozen_files.py
      - name: 原ログ・対象SHA・全結果を保存（失敗時も実行）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: equipment-core-${{ matrix.profile }}
          path: ${{ runner.temp }}/equipment-evidence/
          if-no-files-found: error

  invalid:
    name: equipment-invalid (${{ matrix.profile }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        profile: ["038", "041", "latest"]
    steps:
      - uses: actions/checkout@v4
        with:
          # PRのmerge refで固定版と最新HEADを混同しない。
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 完成版・基点・当時の原証拠を完全SHAで取得
        run: |
          git fetch --no-tags --depth=1 origin \
            dbceae8f68e18939a40ace71f3a24a1a1953e653 \
            45a58b7faf09809d916954353a3a1fe0c3d2d035 \
            8d3c1848d09b588fa41bcf6345d3aab6e12a5347 \
            821448b384d37edc041152beb5d6b6f560ad771d \
            79caadbe71e13ba7060aab598dc460035b04cab9 \
            2547e91d36c59ed6d59f46be15c5c40b20a6b184 \
            ddf2153e0f47513eb7906ddd68ab03b645edacd7
      - name: 公式Godotを既存指定hashで照合
        run: |
          curl -fL -o "$RUNNER_TEMP/equipment-godot.zip" "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          echo "${GODOT_LINUX_SHA256}  $RUNNER_TEMP/equipment-godot.zip" | sha256sum --check
          unzip -q "$RUNNER_TEMP/equipment-godot.zip" -d "$RUNNER_TEMP/equipment-bin"
          mv "$RUNNER_TEMP/equipment-bin/Godot_v${GODOT_VERSION}_linux.x86_64" "$RUNNER_TEMP/equipment-bin/godot"
          chmod +x "$RUNNER_TEMP/equipment-bin/godot"
      - name: 異常定義202ケース・各子30秒
        run: |
          python tools/run_equipment_ci.py --suite invalid --profile "${{ matrix.profile }}" \
            --latest-sha "$(git rev-parse HEAD)" --godot "$RUNNER_TEMP/equipment-bin/godot" \
            --output "$RUNNER_TEMP/equipment-evidence"
      - name: 最新checkoutの保護照合（失敗時も実行）
        if: always()
        run: python tools/check_frozen_files.py
      - name: 原ログ・対象SHA・全結果を保存（失敗時も実行）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: equipment-invalid-${{ matrix.profile }}
          path: ${{ runner.temp }}/equipment-evidence/
          if-no-files-found: error

  migration:
    name: equipment-migration (${{ matrix.profile }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        profile: ["041", "latest"]
    steps:
      - uses: actions/checkout@v4
        with:
          # PRのmerge refで固定版と最新HEADを混同しない。
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 完成版・基点・当時の原証拠を完全SHAで取得
        run: |
          git fetch --no-tags --depth=1 origin \
            dbceae8f68e18939a40ace71f3a24a1a1953e653 \
            45a58b7faf09809d916954353a3a1fe0c3d2d035 \
            8d3c1848d09b588fa41bcf6345d3aab6e12a5347 \
            821448b384d37edc041152beb5d6b6f560ad771d \
            79caadbe71e13ba7060aab598dc460035b04cab9 \
            2547e91d36c59ed6d59f46be15c5c40b20a6b184 \
            ddf2153e0f47513eb7906ddd68ab03b645edacd7
      - name: 公式Godotを既存指定hashで照合
        run: |
          curl -fL -o "$RUNNER_TEMP/equipment-godot.zip" "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          echo "${GODOT_LINUX_SHA256}  $RUNNER_TEMP/equipment-godot.zip" | sha256sum --check
          unzip -q "$RUNNER_TEMP/equipment-godot.zip" -d "$RUNNER_TEMP/equipment-bin"
          mv "$RUNNER_TEMP/equipment-bin/Godot_v${GODOT_VERSION}_linux.x86_64" "$RUNNER_TEMP/equipment-bin/godot"
          chmod +x "$RUNNER_TEMP/equipment-bin/godot"
      - name: S1純粋移行61ケース
        run: |
          python tools/run_equipment_ci.py --suite migration --profile "${{ matrix.profile }}" \
            --latest-sha "$(git rev-parse HEAD)" --godot "$RUNNER_TEMP/equipment-bin/godot" \
            --output "$RUNNER_TEMP/equipment-evidence"
      - name: 最新checkoutの保護照合（失敗時も実行）
        if: always()
        run: python tools/check_frozen_files.py
      - name: 原ログ・対象SHA・全結果を保存（失敗時も実行）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: equipment-migration-${{ matrix.profile }}
          path: ${{ runner.temp }}/equipment-evidence/
          if-no-files-found: error

  legacy:
    name: equipment-legacy (${{ matrix.profile }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        profile: ["baseline", "041", "latest"]
    steps:
      - uses: actions/checkout@v4
        with:
          # PRのmerge refで固定版と最新HEADを混同しない。
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 完成版・基点・当時の原証拠を完全SHAで取得
        run: |
          git fetch --no-tags --depth=1 origin \
            dbceae8f68e18939a40ace71f3a24a1a1953e653 \
            45a58b7faf09809d916954353a3a1fe0c3d2d035 \
            8d3c1848d09b588fa41bcf6345d3aab6e12a5347 \
            821448b384d37edc041152beb5d6b6f560ad771d \
            79caadbe71e13ba7060aab598dc460035b04cab9 \
            2547e91d36c59ed6d59f46be15c5c40b20a6b184 \
            ddf2153e0f47513eb7906ddd68ab03b645edacd7
      - name: 公式Godotを既存指定hashで照合
        run: |
          curl -fL -o "$RUNNER_TEMP/equipment-godot.zip" "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          echo "${GODOT_LINUX_SHA256}  $RUNNER_TEMP/equipment-godot.zip" | sha256sum --check
          unzip -q "$RUNNER_TEMP/equipment-godot.zip" -d "$RUNNER_TEMP/equipment-bin"
          mv "$RUNNER_TEMP/equipment-bin/Godot_v${GODOT_VERSION}_linux.x86_64" "$RUNNER_TEMP/equipment-bin/godot"
          chmod +x "$RUNNER_TEMP/equipment-bin/godot"
      - name: 旧入口142検証・10更新
        run: |
          python tools/run_equipment_ci.py --suite legacy --profile "${{ matrix.profile }}" \
            --latest-sha "$(git rev-parse HEAD)" --godot "$RUNNER_TEMP/equipment-bin/godot" \
            --output "$RUNNER_TEMP/equipment-evidence"
      - name: 最新checkoutの保護照合（失敗時も実行）
        if: always()
        run: python tools/check_frozen_files.py
      - name: 原ログ・対象SHA・全結果を保存（失敗時も実行）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: equipment-legacy-${{ matrix.profile }}
          path: ${{ runner.temp }}/equipment-evidence/
          if-no-files-found: error

  legacy-comparison:
    name: equipment-legacy-comparison
    needs: legacy
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          # PRのmerge refで固定版と最新HEADを混同しない。
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 旧基点・固定041の原本と当時の旧出力を読取り取得
        run: |
          git fetch --no-tags --depth=1 origin \
            821448b384d37edc041152beb5d6b6f560ad771d \
            8d3c1848d09b588fa41bcf6345d3aab6e12a5347 \
            ddf2153e0f47513eb7906ddd68ab03b645edacd7
      - uses: actions/download-artifact@v4
        with:
          pattern: equipment-legacy-*
          path: ${{ runner.temp }}/equipment-inputs
      - name: 固定と最新を基点出力へbyte照合（欠落・失敗も拒否）
        run: |
          python tools/run_equipment_ci.py --suite compare --latest-sha "$(git rev-parse HEAD)" \
            --inputs "$RUNNER_TEMP/equipment-inputs" --output "$RUNNER_TEMP/equipment-evidence"
      - name: 最新checkoutの保護照合（失敗時も実行）
        if: always()
        run: python tools/check_frozen_files.py
      - name: 原ログ・対象SHA・全結果を保存（失敗時も実行）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: equipment-legacy-comparison
          path: ${{ runner.temp }}/equipment-evidence/
          if-no-files-found: error

  failure-propagation:
    name: equipment-failure-propagation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          # PRのmerge refで固定版と最新HEADを混同しない。
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 失敗伝播fixtureの固定原本・当時の旧出力を読取り取得
        run: |
          git fetch --no-tags --depth=1 origin \
            821448b384d37edc041152beb5d6b6f560ad771d \
            8d3c1848d09b588fa41bcf6345d3aab6e12a5347 \
            ddf2153e0f47513eb7906ddd68ab03b645edacd7
      - name: 専用fixtureで実際のexit1・警告・件数欠落・timeout拒否を実証
        run: |
          python tools/run_equipment_ci.py --suite self-test --latest-sha "$(git rev-parse HEAD)" \
            --output "$RUNNER_TEMP/equipment-evidence"
      - name: 最新checkoutの保護照合（失敗時も実行）
        if: always()
        run: python tools/check_frozen_files.py
      - name: 原ログ・対象SHA・全結果を保存（失敗時も実行）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: equipment-failure-propagation
          path: ${{ runner.temp }}/equipment-evidence/
          if-no-files-found: error
