name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  GODOT_VERSION: 4.7.2-stable

jobs:
  assets:
    name: 素材検査
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pillow を導入
        run: pip install pillow

      - name: 素材台帳に従って検査
        run: python tools/validate_assets.py --strict

  godot-import:
    name: Godot インポート検査
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Godot プロジェクトの有無を確認
        id: check
        run: |
          if [ -f project.godot ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::notice::project.godot がまだ無いため、この検査を省略しました。"
          fi

      - name: Godot を取得
        if: steps.check.outputs.exists == 'true'
        run: |
          # ダウンロードが 404 になる場合は、下記ページで実際のファイル名を確認して合わせること
          # https://github.com/godotengine/godot-builds/releases
          URL="https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          curl -fL -o godot.zip "$URL"
          unzip -q godot.zip
          mv Godot_v${GODOT_VERSION}_linux.x86_64 godot
          chmod +x godot
          ./godot --version

      - name: インポートしてエラーを検出
        if: steps.check.outputs.exists == 'true'
        run: |
          set -o pipefail
          # インポートは初回に時間がかかるため上限を設ける
          timeout 600 ./godot --headless --import 2>&1 | tee import.log || true
          if grep -E "SCRIPT ERROR|ERROR:|Parse Error" import.log; then
            echo "::error::Godot のインポートでエラーが出ました。上のログを確認してください。"
            exit 1
          fi
          echo "インポートは正常に完了しました。"

      - name: ログを保存
        if: always() && steps.check.outputs.exists == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: godot-import-log
          path: import.log
          if-no-files-found: ignore
