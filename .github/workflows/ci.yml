name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  GODOT_VERSION: 4.7.2-stable
  GODOT_LINUX_SHA256: cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4

permissions:
  contents: read

jobs:
  assets:
    name: 素材検査
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pillow を導入
        run: pip install pillow

      - name: 素材台帳に従って検査
        run: python tools/validate_assets.py --strict

  godot-import:
    name: Godot・凍結受入テスト
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 凍結ファイルのハッシュを確認
        run: python tools/check_frozen_files.py

      - name: Godot プロジェクトの有無を確認
        id: check
        run: |
          if [ -f project.godot ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::notice::project.godot がまだ無いため、この検査を省略しました。"
          fi

      - name: Godot を取得
        if: steps.check.outputs.exists == 'true'
        run: |
          # ダウンロードが 404 になる場合は、下記ページで実際のファイル名を確認して合わせること
          # https://github.com/godotengine/godot-builds/releases
          URL="https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          curl -fL -o godot.zip "$URL"
          echo "${GODOT_LINUX_SHA256}  godot.zip" | sha256sum --check
          unzip -q godot.zip
          mv Godot_v${GODOT_VERSION}_linux.x86_64 godot
          chmod +x godot
          ./godot --version

      - name: インポートしてエラーを検出
        if: steps.check.outputs.exists == 'true'
        run: |
          set -o pipefail
          # インポートは初回に時間がかかるため上限を設ける
          timeout 600 ./godot --headless --import 2>&1 | tee import.log
          if grep -E "SCRIPT ERROR|ERROR:|WARNING:|Parse Error" import.log; then
            echo "::error::Godot のインポートでエラーが出ました。上のログを確認してください。"
            exit 1
          fi
          echo "インポートは正常に完了しました。"

      - name: R-01からR-08のverifyを実行
        if: steps.check.outputs.exists == 'true'
        run: |
          export PATH="$PWD:$PATH"
          python tools/run_locked_checks.py

      - name: 帰還・任意戦闘・解除確認の操作検査
        if: steps.check.outputs.exists == 'true'
        run: |
          set -o pipefail
          timeout 180 ./godot --headless --path . --script res://tools/check_progression_paths.gd 2>&1 | tee progression.log
          timeout 180 ./godot --headless --path . --script res://tools/check_progression_paths.gd -- --three-member-party 2>&1 | tee -a progression.log
          if grep -E "SCRIPT ERROR|ERROR:|WARNING:|Parse Error" progression.log; then
            exit 1
          fi

      - name: 侵蝕の加算と不可逆操作の確認を検査
        if: steps.check.outputs.exists == 'true'
        run: |
          set -o pipefail
          timeout 180 ./godot --headless --path . --script res://tools/check_erosion_choices.gd 2>&1 | tee erosion.log
          if grep -E "SCRIPT ERROR|ERROR:|WARNING:|Parse Error" erosion.log; then
            exit 1
          fi

      - name: 敵の行動予定と連戦の保存を検査
        if: steps.check.outputs.exists == 'true'
        run: |
          set -o pipefail
          timeout 180 ./godot --headless --path . --script res://tools/check_enemy_encounters.gd 2>&1 | tee encounters.log
          if grep -E "SCRIPT ERROR|ERROR:|WARNING:|Parse Error" encounters.log; then
            exit 1
          fi
          test "$(grep -c '^ENCOUNTER_PASS:' encounters.log)" -eq 1

      - name: 探索設備・補給箱・開通した近道の保存を検査
        if: steps.check.outputs.exists == 'true'
        run: |
          set -o pipefail
          timeout 180 ./godot --headless --path . --script res://tools/check_exploration_devices.gd 2>&1 | tee exploration.log
          if grep -E "SCRIPT ERROR|ERROR:|WARNING:|Parse Error" exploration.log; then
            exit 1
          fi
          test "$(grep -c '^EXPLORATION_PASS:' exploration.log)" -eq 1

      - name: v1物語の二つの再訪順と結末を検査
        if: steps.check.outputs.exists == 'true'
        run: |
          set -o pipefail
          timeout 300 ./godot --headless --path . --script res://tools/check_story_campaign.gd 2>&1 | tee story.log
          timeout 300 ./godot --headless --path . --script res://tools/check_story_campaign.gd -- --three-member-party --teaching-first 2>&1 | tee -a story.log
          if grep -E "SCRIPT ERROR|ERROR:|WARNING:|Parse Error" story.log; then
            exit 1
          fi
          test "$(grep -c '^STORY_PASS:' story.log)" -eq 2

      - name: 検証後も保護ファイルが不変であることを確認
        if: always()
        run: python tools/check_frozen_files.py

      - name: ログを保存
        if: always() && steps.check.outputs.exists == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: godot-import-log
          path: |
            import.log
            progression.log
            erosion.log
            encounters.log
            exploration.log
            story.log
            docs/verification/scope-lock-current.json
            .tools/verification/current-*/*.log
          if-no-files-found: ignore
