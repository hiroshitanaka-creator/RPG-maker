name: 保存専用native Windows・Linux CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  GODOT_VERSION: 4.7.2-stable
  RPG066_CODE_SHA: 30ea6a5bc50f99ded868f9618655c6289ddb5727
  RPG066_COMPLETION_SHA: c985ca590886d04b15c50cf933ea6689d1aaad82
  PYTHONUTF8: 1
  GIT_CONFIG_COUNT: 1
  GIT_CONFIG_KEY_0: core.autocrlf
  GIT_CONFIG_VALUE_0: false

jobs:
  platform:
    name: equipment-native (${{ matrix.os }}, ${{ matrix.profile }}, ${{ matrix.phase }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        profile: [fixed055, fixed057, latest]
        phase: [transaction, primitives]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: 055完成コードを完全SHAで別checkout
        if: matrix.profile == 'fixed055'
        shell: bash
        run: |
          python -c "import pathlib,re,subprocess; sha=pathlib.Path('docs/verification/equipment-save-transaction-platform/code-fixed-sha.txt').read_text().strip(); assert re.fullmatch('[0-9a-f]{40}',sha); subprocess.run(['git','fetch','--no-tags','--depth=1','origin',sha],check=True); subprocess.run(['git','checkout','--detach',sha],check=True)"
      - name: 057完成コードを完全SHAで別checkout（当時の検査を保持）
        if: matrix.profile == 'fixed057'
        shell: bash
        run: |
          cp tools/fixtures/equipment-save-transaction-platform/diagnostic_fixed057.py "$RUNNER_TEMP/diagnostic_fixed057.py"
          git fetch --no-tags --depth=1 origin 3cf4b6c293f6796220b43cf566f8eb792c3932ec
          git checkout --detach 3cf4b6c293f6796220b43cf566f8eb792c3932ec
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
        with:
          arch: x64
      - name: 原固定053を完全SHAで取得
        shell: bash
        run: git fetch --no-tags --depth=1 origin e003b126de6695fa131e07a3db14c3011fb74f2e b17f2b475ff8c58924720ea24cce8f205422c50b
      - name: 最新側のscope用完成SHAを完全SHAで取得
        if: matrix.profile != 'fixed055'
        shell: bash
        run: |
          python -c "import pathlib,re,subprocess; sha=pathlib.Path('docs/verification/equipment-save-transaction-platform/code-fixed-sha.txt').read_text().strip(); assert re.fullmatch('[0-9a-f]{40}',sha); subprocess.run(['git','fetch','--no-tags','--depth=1','origin',sha],check=True)"
      - name: 057範囲用の基点・完成SHAを完全SHAで取得
        if: matrix.profile != 'fixed055'
        shell: bash
        run: |
          python -c "import pathlib,re,subprocess; sha=pathlib.Path('docs/verification/task057-save-qa-diagnostics/code-fixed-sha.txt').read_text().strip(); assert re.fullmatch('[0-9a-f]{40}',sha); subprocess.run(['git','fetch','--no-tags','--depth=1','origin',sha,'849d02bd2ea4dd44298eef225fe9a12927858d1b','878c2316a4c9e72b253f7df001b6c6438ef7cb6d'],check=True)"
      - name: 059範囲・058基点用の完全SHAを取得
        if: matrix.profile == 'latest'
        shell: bash
        run: |
          python -c "import pathlib,re,subprocess; sha=pathlib.Path('docs/verification/task059-save-qa-finalization/code-fixed-sha.txt').read_text().strip(); assert re.fullmatch('[0-9a-f]{40}',sha); subprocess.run(['git','fetch','--no-tags','--depth=1','origin',sha,'579ca1f463aaf9e93275039a59cf9d1ffb86adb5','a6022f1e4a7689440928efe65db444336e9128e4'],check=True)"
      - name: 066登録と065提出の完全SHAを取得
        if: always() && matrix.profile == 'latest'
        shell: bash
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          import subprocess
          import sys
          sys.path.insert(0, 'tools/fixtures/equipment-save-transaction-platform')
          import native_build_contract_v1 as n
          roles = (
              ('registration066', lambda: n.REGISTER),
              ('submitted065', lambda: n.BASE),
              ('code065', lambda: n.CODE065),
              ('baseline066', lambda: n.GENERATION_APPROVAL['baseline_sha']),
              ('pin066', lambda: Path(n.EVIDENCE + 'code-fixed-sha.txt').read_text().strip()),
              ('code066', lambda: os.environ.get('RPG066_CODE_SHA')),
              ('completion066', lambda: os.environ.get('RPG066_COMPLETION_SHA')),
          )
          failed = []
          for role, read_sha in roles:
              try:
                  sha = n.old.sha(read_sha())
                  print('066_FETCH_BEGIN ' + role + ' ' + sha, flush=True)
                  shallow = subprocess.check_output(['git', 'rev-parse', '--is-shallow-repository'], text=True).strip()
                  n.require(shallow in ('true', 'false'), 'shallow状態不明')
                  argv = ['git', 'fetch', '--no-tags'] + (['--unshallow'] if shallow == 'true' else []) + ['origin', sha]
                  result = subprocess.run(argv, check=False)
                  if result.returncode != 0:
                      raise RuntimeError('git fetch exit=' + str(result.returncode))
                  print('066_FETCH_OK ' + role + ' ' + sha, flush=True)
              except Exception as exc:
                  failed.append(role)
                  print('066_FETCH_FAIL ' + role + ' ' + type(exc).__name__ + ': ' + str(exc), flush=True)
          print('066_FETCH_FAILED_ROLES ' + ','.join(failed), flush=True)
          sys.exit(1 if failed else 0)
          PY
      - name: 固定ビルド依存を導入
        run: python -m pip install scons==4.10.0
      - name: 066退避前のGit原物を先行記録
        if: always() && matrix.profile == 'latest'
        shell: bash
        run: python tools/fixtures/equipment-save-transaction-platform/native_build_contract_v1.py --output "$RUNNER_TEMP/native-evidence" --platform "${{ runner.os == 'Windows' && 'windows' || 'linux' }}" --phase "${{ matrix.phase }}" --stage before-shipped
      - name: 提出済みDLL・SOを実ロード照合用に保持
        run: python -c "import os,shutil; shutil.copytree('addons/equipment_save_io',os.environ['RUNNER_TEMP']+'/native-evidence/shipped/equipment_save_io')"
      - name: 066退避品とGit原blobを独立照合
        if: always() && matrix.profile == 'latest'
        shell: bash
        run: python tools/fixtures/equipment-save-transaction-platform/native_build_contract_v1.py --output "$RUNNER_TEMP/native-evidence" --platform "${{ runner.os == 'Windows' && 'windows' || 'linux' }}" --phase "${{ matrix.phase }}" --stage after-shipped
      - name: 固定依存からdebug/release DLL・SOを構築
        shell: bash
        run: |
          if [ "${{ matrix.profile }}" = "latest" ]; then
            python tools/fixtures/equipment-save-transaction-platform/diagnostic_ci_build_v1.py --output "$RUNNER_TEMP/native-evidence" --platform "${{ runner.os == 'Windows' && 'windows' || 'linux' }}" --phase "${{ matrix.phase }}" --build
          else
            python native/equipment_save_io/build.py --platform "${{ runner.os == 'Windows' && 'windows' || 'linux' }}" --output "$RUNNER_TEMP/native-evidence/build"
          fi
      - name: 公式4.7.2と専用検査
        shell: bash
        env:
          EQUIPMENT_SHIPPED_ADDON_ROOT: ${{ runner.temp }}/native-evidence/shipped/equipment_save_io
        run: |
          python tools/fixtures/equipment-save-transaction-platform/launch.py --output "$RUNNER_TEMP/native-evidence" --profile "${{ matrix.profile == 'fixed055' && 'fixed055' || 'latest' }}" --phase "${{ matrix.phase }}"
      - name: 066検査後の実QA対象を照合（失敗時も採取）
        if: always() && matrix.profile == 'latest'
        shell: bash
        run: python tools/fixtures/equipment-save-transaction-platform/native_build_contract_v1.py --output "$RUNNER_TEMP/native-evidence" --platform "${{ runner.os == 'Windows' && 'windows' || 'linux' }}" --phase "${{ matrix.phase }}" --stage after-tests
      - name: 保護照合（失敗時も実行）
        if: always()
        run: python tools/check_frozen_files.py
      - name: 世代別ログ回収正負・scope・6seed計測対照（全取引判定と別）
        if: always() && matrix.profile != 'fixed055'
        shell: bash
        run: |
          if [ "${{ matrix.profile }}" = "fixed057" ]; then
            python "$RUNNER_TEMP/diagnostic_fixed057.py" --checkout "$GITHUB_WORKSPACE" --output "$RUNNER_TEMP/native-evidence"
          else
            python tools/fixtures/equipment-save-transaction-platform/diagnostic_ci_build_v1.py --output "$RUNNER_TEMP/native-evidence" --platform "${{ runner.os == 'Windows' && 'windows' || 'linux' }}" --phase "${{ matrix.phase }}"
          fi
      - name: 059診断の原物と失敗内訳を独立保存（全原証拠も保持）
        if: always() && matrix.profile == 'latest'
        shell: bash
        run: |
          python tools/fixtures/equipment-save-transaction-platform/diagnostic_evidence_build_v1.py --output "$RUNNER_TEMP/native-evidence" --platform "${{ runner.os == 'Windows' && 'windows' || 'linux' }}" --phase "${{ matrix.phase }}" --destination "$RUNNER_TEMP/diagnostic059-small"
      - name: 059診断だけの小さい原証拠を保存（失敗時も実行）
        if: always() && matrix.profile == 'latest'
        uses: actions/upload-artifact@v4
        with:
          name: diagnostic059-${{ matrix.os }}-${{ matrix.phase }}
          path: ${{ runner.temp }}/diagnostic059-small/
          if-no-files-found: error
      - name: 066副産物の原bytesと移動証拠を独立保存（失敗時も実行）
        if: always() && matrix.profile == 'latest'
        uses: actions/upload-artifact@v4
        with:
          name: native-byproducts-v2-${{ matrix.os }}-${{ matrix.phase }}
          path: |
            ${{ runner.temp }}/native-evidence/build-byproducts-v2/
            ${{ runner.temp }}/native-build-v1/byproduct-receipts-v2/
          if-no-files-found: error
      - name: 原bytesとarchive hashをjobにも保持（失敗時も実行）
        if: always()
        shell: bash
        run: python tools/fixtures/equipment-save-transaction-platform/evidence.py --output "$RUNNER_TEMP/native-evidence"
      - name: 配布物・全原証拠を保存（失敗時も実行）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: equipment-native-${{ matrix.os }}-${{ matrix.profile }}-${{ matrix.phase }}
          path: |
            ${{ runner.temp }}/native-evidence/
            ${{ runner.temp }}/native-build-v1/
            addons/equipment_save_io/
            native/equipment_save_io/GODOT_CPP_LICENSE.txt
          if-no-files-found: error
