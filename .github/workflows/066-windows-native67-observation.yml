name: 066 Windows 原67・副生成物時刻の対照観測
on:
  push:
    branches: [codex/task-066-measurements-20261015]
permissions:
  contents: read
env:
  PYTHONUTF8: 1
  GIT_CONFIG_COUNT: 1
  GIT_CONFIG_KEY_0: core.autocrlf
  GIT_CONFIG_VALUE_0: false
jobs:
  native67:
    name: 066-native67-comparison (${{ matrix.sample }})
    runs-on: windows-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - {sample: native-control-1, candidate: 'no'}
          - {sample: native-combined-1, candidate: 'yes'}
          - {sample: native-combined-2, candidate: 'yes'}
          - {sample: native-control-2, candidate: 'no'}
