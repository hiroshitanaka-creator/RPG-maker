      - uses: actions/checkout@v4
        with:
          ref: 15cbe9b7f6769a2f3fd037b57bbf138d25726be5
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'
      - name: checkout外へ観測コードと固定候補を配置
        shell: bash
        run: |
          python - <<'PY'
          import base64,gzip,hashlib,os
          from pathlib import Path
          out=Path(os.environ['RUNNER_TEMP'])/'066-observer'
          out.mkdir(parents=True,exist_ok=False)
          data=gzip.decompress(base64.b64decode('',validate=True))
          assert hashlib.sha256(data).hexdigest()=='295c882ea86f143af09133b309463024fc6ed3a8dd455f6e5cb27a64a12658f4'
          (out/'observe_native67.py').write_bytes(data)
          data=gzip.decompress(base64.b64decode('',validate=True))
          assert hashlib.sha256(data).hexdigest()=='4e9fc66fa03bf6b07e312f171c3ee39dd037ae97a99c6002b75cd5fd6ccfe3ec'
          (out/'clock_build_observer.py').write_bytes(data)
          data=gzip.decompress(base64.b64decode('',validate=True))
          assert hashlib.sha256(data).hexdigest()=='671cb673802138ce123b98072345afbcaea5a24ead0701edf0bacfdc6168487c'
          (out/'git_launch_probe.py').write_bytes(data)
          data=gzip.decompress(base64.b64decode('',validate=True))
          assert hashlib.sha256(data).hexdigest()=='339e5d9dacac6deef0b926411418101f2329bf1d20dbd1305ef3ca38d9c65411'
          (out/'pack_observation.py').write_bytes(data)
          data=gzip.decompress(base64.b64decode('',validate=True))
          assert hashlib.sha256(data).hexdigest()=='2419d54309269410c6d2d1d201483fcb1730b9f6ba8a85c375ba9520492f472f'
          (out/'combined-source.py').write_bytes(data)
          data=gzip.decompress(base64.b64decode('',validate=True))
          assert hashlib.sha256(data).hexdigest()=='782a9a15590a55eb037b7b97b2e9765549630b635283c0d2c0b8acd49818b89f'
          (out/'clock-source.py').write_bytes(data)
          PY
      - name: 候補群だけ隔離checkoutの1ファイルを差替え
        if: matrix.candidate == 'yes'
        shell: bash
        run: |
          python - <<'PY'
          import hashlib,os
          from pathlib import Path
          target=Path(os.environ['GITHUB_WORKSPACE'])/'tools/fixtures/equipment-save-transaction-platform/native_build_contract_v1.py'
          assert hashlib.sha256(target.read_bytes()).hexdigest()=='8cf80b3502fc3d4eed153b71836dfd430e6b12f1064ed336a35bfccdc11cd314'
          raw=(Path(os.environ['RUNNER_TEMP'])/'066-observer/combined-source.py').read_bytes()
          assert hashlib.sha256(raw).hexdigest()=='2419d54309269410c6d2d1d201483fcb1730b9f6ba8a85c375ba9520492f472f'
          target.write_bytes(raw)
          PY
      - name: 原67を既存30秒監督で1回実行
        shell: bash
        env:
          USE_CANDIDATE: ${{ matrix.candidate }}
          SAMPLE: ${{ matrix.sample }}
        run: |
          extra=()
          if [ "$USE_CANDIDATE" = yes ]; then extra=(--candidate-sha256 2419d54309269410c6d2d1d201483fcb1730b9f6ba8a85c375ba9520492f472f); fi
          python "$RUNNER_TEMP/066-observer/observe_native67.py" --checkout "$GITHUB_WORKSPACE" --output "$RUNNER_TEMP/066-observer/result" --mode control --sequence "$SAMPLE" "${extra[@]}"
      - name: 原67終了後にGit起動と時計を独立観測
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import os,sys
          from pathlib import Path
          root=Path(os.environ['GITHUB_WORKSPACE'])
          out=Path(os.environ['RUNNER_TEMP'])/'066-observer'
          sys.path.insert(0,str(root/'tools/fixtures/equipment-save-transaction-platform'))
          from diagnostic_ci057 import capture_diagnostic
          cap,errors=capture_diagnostic([sys.executable,str(out/'git_launch_probe.py'),'--checkout',str(root),'--output',str(out/'git-launch-probe')],out/'git-probe.log',out/'git-probe-process.json',root,30)
          print(errors,flush=True)
          sys.exit(1 if errors or cap.row['exit_code']!=0 or cap.row.get('supervision',{}).get('stopped') is not True else 0)
          PY
      - name: 失敗を含む全原記録を照合して無損失分割
